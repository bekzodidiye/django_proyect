{% extends 'news/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="close-btn" title="Yopish">&times;</a>
            <div class="auth-header">
                <h1>Ro'yxatdan o'tish</h1>
                <p>Yangi hisob yarating va yangiliklardan habardor bo'ling.</p>
            </div>

            {% if error %}
            <div class="error-msg">
                {{ error }}
            </div>
            {% endif %}

            <form action="{% url 'signup' %}" method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Foydalanuvchi nomi</label>
                    <input type="text" id="username" name="username" class="form-control" 
                        placeholder="Foydalanuvchi nomi" required>
                </div>
                <div class="form-group">
                    <label for="email">Email manzil</label>
                    <input type="email" id="email" name="email" class="form-control" 
                        placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Parol</label>
                    <input type="password" id="password" name="password" class="form-control" 
                        placeholder="Kamida 8 belgi" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Parolni tasdiqlang</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" 
                        placeholder="Parolni qayta kiriting" required>
                </div>
                <button type="submit" class="auth-btn">Ro'yxatdan o'tish</button>
            </form>

            <div class="auth-footer">
                <p>Sizda hisob bormi? <a href="{% url 'login' %}">Kirish</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
