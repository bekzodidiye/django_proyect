{% extends 'news/base.html' %}
{% load static %}

{% block content %}
<main>
    <div class="about-details section-padding80" style="padding-top: 100px; padding-bottom: 100px;">
        <div class="container">
            <div class="row">
                <div class="offset-xl-3 col-lg-6">
                    <div class="login-form-area" style="background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
                        <div class="section-tittle mb-30">
                            <h3>Parolni o'zgartirish</h3>
                        </div>
                        <form action="{% url 'password_change' %}" method="post" class="password-form">
                            {% csrf_token %}
                            {{ form.as_p }}

                            <div class="mt-40">
                                <button type="submit" class="btn btn-danger" style="width: 100%; border-radius: 30px; padding: 15px; font-weight: 700; letter-spacing: 1px; transition: all 0.3s ease;">
                                    PAROLNI YANGILASH
                                </button>
                                <div class="text-center mt-20">
                                    <a href="{% url 'user_profile' %}" style="color: #635c5c; font-size: 14px;">Bekor qilish</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    .password-form input {
        width: 100%;
        padding: 12px 20px;
        border: 1px solid #e1e1e1;
        border-radius: 8px;
        outline: none;
        transition: all 0.3s ease;
        background: #fcfcfc;
    }
    .password-form input:focus {
        border-color: #ff2143;
        background: #fff;
        box-shadow: 0 4px 12px rgba(255, 33, 67, 0.08);
    }
    .help-text ul {
        list-style: disc;
        margin-left: 20px;
        margin-top: 5px;
    }
</style>
{% endblock %}
