{% extends 'news/base.html' %}
{% load static %}

{% block content %}
<main>
    <div class="about-details section-padding80" style="padding-top: 100px; padding-bottom: 100px;">
        <div class="container">
            <div class="row">
                <div class="offset-xl-3 col-lg-6">
                    <div class="login-form-area text-center" style="background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f0f0f0;">
                        <div class="section-tittle mb-30">
                            <i class="fas fa-envelope-open-text" style="font-size: 50px; color: #ff2143; margin-bottom: 25px;"></i>
                            <h2 style="font-size: 24px; font-weight: 800; color: #141b22;">Email yuborildi</h2>
                        </div>
                        <p style="color: #635c5c; line-height: 1.6;">Biz sizga parolni tiklash bo'yicha ko'rsatmalarni elektron pochta manzilingizga yubordik. Agar email kelmasa, iltimos, spam papkasini tekshirib ko'ring.</p>
                        <div class="mt-40">
                            <a href="{% url 'login' %}" class="btn btn-danger" style="border-radius: 30px; padding: 18px 45px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Kirishga qaytish</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
