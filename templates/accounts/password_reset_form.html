{% extends 'news/base.html' %}
{% load static %}

{% block content %}
<main>
    <div class="about-details section-padding80" style="padding-top: 100px; padding-bottom: 100px;">
        <div class="container">
            <div class="row">
                <div class="offset-xl-3 col-lg-6">
                    <div class="login-form-area" style="background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f0f0f0;">
                        <div class="section-tittle mb-30">
                            <h2 style="font-size: 24px; font-weight: 800; color: #141b22;">Parolni tiklash</h2>
                            <p style="color: #635c5c; margin-top: 10px;">Elektron pochta manzilingizni kiriting, biz sizga parolni tiklash bo'yicha ko'rsatmalarni yuboramiz.</p>
                        </div>
                        <form action="{% url 'password_reset' %}" method="post" class="password-form">
                            {% csrf_token %}
                            {{ form.as_p }}
                            
                            <div class="mt-40">
                                <button type="submit" class="btn btn-danger" style="width: 100%; border-radius: 30px; padding: 18px; font-weight: 700; letter-spacing: 1px; transition: all 0.3s ease; text-transform: uppercase;">
                                    Tiklash havolasini yuborish
                                </button>
                                <div class="text-center mt-20">
                                    <a href="{% url 'login' %}" style="color: #635c5c; font-size: 14px;">Kirish sahifasiga qaytish</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    .password-form p {
        margin-bottom: 25px;
    }
    .password-form label {
        display: block;
        font-weight: 600;
        color: #141b22;
        margin-bottom: 8px;
        font-size: 14px;
    }
    .password-form input {
        width: 100%;
        padding: 12px 20px;
        border: 1px solid #e1e1e1;
        border-radius: 8px;
        outline: none;
        transition: all 0.3s ease;
        background: #fcfcfc;
    }
    .password-form input:focus {
        border-color: #ff2143;
        background: #fff;
        box-shadow: 0 4px 12px rgba(255, 33, 67, 0.08);
    }
    .errorlist {
        color: #ff2143;
        list-style: none;
        padding: 0;
        font-size: 13px;
        margin-top: 5px;
    }
</style>
{% endblock %}
