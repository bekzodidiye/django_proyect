{% extends 'news/base.html' %}
{% load static %}

{% block content %}
<section class="news-crud-area">
    <div class="container mt-5 mb-100">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="crud-card shadow-lg border-0 rounded-lg overflow-hidden animate-zoomIn">
                    <div class="card-header bg-danger text-white text-center py-4">
                        <i class="ti-alert mb-2 d-block" style="font-size: 50px;"></i>
                        <h2 class="text-white mb-0" style="font-weight: 700;">Xabarni o'chirish</h2>
                    </div>
                    <div class="card-body p-5 text-center">
                        <h4 class="mb-4 text-dark" style="font-weight: 600;">Siz haqiqatan ham ushbu xabarni butunlay o'chirib tashlamoqchimisiz?</h4>
                        
                        <div class="news-preview-box p-4 bg-light rounded-3 mb-5 border shadow-sm">
                            <p class="mb-0 fw-bold text-secondary" style="font-size: 1.1rem;">
                                "{{ news.title|default:object.title }}"
                            </p>
                        </div>

                        <form action="" method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center flex-wrap" style="gap: 20px;">
                                <button type="submit" class="btn btn-danger-custom px-5 py-3 shadow">
                                    <i class="ti-trash mr-2"></i> HA, O'CHIRILSIN
                                </button>
                                <a href="{% url 'all_news_list' %}" class="btn btn-secondary-custom px-5 py-3 shadow">
                                    <i class="ti-back-left mr-2"></i> YO'Q, QAYTISH
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .animate-zoomIn {
        animation: zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

    .news-preview-box {
        background: #f8f9fa;
        border-radius: 15px;
        transition: all 0.3s ease;
    }

    .btn-danger-custom {
        background: #ff214f;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        min-width: 200px;
    }

    .btn-danger-custom:hover {
        background: #d91b43;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(255, 33, 79, 0.3) !important;
    }

    .btn-secondary-custom {
        background: #10285d;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        min-width: 200px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-secondary-custom:hover {
        background: #0a1b3d;
        color: #fff;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(16, 40, 93, 0.3) !important;
    }

    .mb-100 {
        margin-bottom: 100px;
    }
    
    .crud-card {
        border-radius: 20px;
    }
</style>
{% endblock %}
